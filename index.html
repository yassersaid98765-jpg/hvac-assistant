<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خبير التكييف AI</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 1px solid #1e293b;
        }
        .title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #38bdf8;
        }
        .btn-api {
            background-color: #059669;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .chat-box {
            flex: 1;
            overflow-y: auto;
            margin: 15px 0;
            padding: 10px;
            background-color: #1e293b;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            padding: 10px 14px;
            border-radius: 8px;
            max-width: 85%;
            line-height: 1.5;
            font-size: 0.95rem;
            white-space: pre-wrap;
        }
        .bot-msg {
            background-color: #334155;
            align-self: flex-start;
        }
        .user-msg {
            background-color: #0284c7;
            align-self: flex-end;
        }
        .input-area {
            display: flex;
            gap: 10px;
        }
        input[type="text"], input[type="password"] {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #334155;
            background-color: #1e293b;
            color: white;
            font-size: 1rem;
        }
        button.send-btn {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #1e293b;
            padding: 20px;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .btn-save { background: #059669; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; }
        .btn-close { background: #64748b; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <div class="title">❄️ خبير التكييف AI</div>
        <button class="btn-api" onclick="openKeyModal()">🔑 إعدادات API</button>
    </div>

    <div class="chat-box" id="chatBox">
        <div class="message bot-msg">أهلاً بك أستاذ ياسر. المساعد الفني الذكي جاهز للاستخدام. كيف يمكنني مساعدتك في صيانة وتشخيص أعطال التكييف والتبريد اليوم؟</div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="اكتب رمز العطل أو السؤال الفني..." onkeypress="handleKeyPress(event)">
        <button class="send-btn" onclick="sendMessage()">إرسال</button>
    </div>

    <div class="modal" id="keyModal">
        <div class="modal-content">
            <h3 style="margin:0; color:#38bdf8;">إعداد مفتاح API</h3>
            <p style="font-size:0.85rem; color:#94a3b8; margin:0;">أدخل مفتاح Gemini API الخاص بك:</p>
            <input type="password" id="apiKeyInput" placeholder="الصق المفتاح هنا (AIzaSy...)">
            <div class="modal-buttons">
                <button class="btn-close" onclick="closeKeyModal()">إلغاء</button>
                <button class="btn-save" onclick="saveApiKey()">حفظ المفتاح</button>
            </div>
        </div>
    </div>

    <script>
        function openKeyModal() {
            const currentKey = localStorage.getItem("gemini_api_key") || "";
            document.getElementById("apiKeyInput").value = currentKey;
            document.getElementById("keyModal").style.display = "flex";
        }

        function closeKeyModal() {
            document.getElementById("keyModal").style.display = "none";
        }

        function saveApiKey() {
            const key = document.getElementById("apiKeyInput").value.trim();
            if (key) {
                localStorage.setItem("gemini_api_key", key);
                alert("تم حفظ المفتاح بنجاح!");
                closeKeyModal();
            } else {
                alert("يرجى إدخال مفتاح صحيح.");
            }
        }

        // قائمة النماذج مرتبة حسب الأفضلية والأحدث
        const MODELS = [
            "gemini-1.5-flash",
            "gemini-2.5-flash",
            "gemini-3.8-flash"
        ];

        async function sendMessage() {
            const input = document.getElementById("userInput");
            const text = input.value.trim();
            if (!text) return;

            const apiKey = localStorage.getItem("gemini_api_key");
            if (!apiKey) {
                openKeyModal();
                return;
            }

            appendMessage(text, "user-msg", "أنت: ");
            input.value = "";

            const botMessageId = appendMessage("...", "bot-msg");
            const botMessageElem = document.getElementById(botMessageId);

            // تجربة النماذج المتاحة بالتوالي لضمان عدم التوقف بسبب الضغط
            let success = false;
            for (const model of MODELS) {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
                
                try {
                    const response = await fetch(url, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            contents: [{
                                parts: [{ text: "أنت مساعد فني خبير ومختصر جداً في صيانة التكييف والتبريد (HVAC/R). أجب بنقاط عملية ومباشرة وبدون مقدمات طويلة.\n\nالسؤال: " + text }]
                            }],
                            generationConfig: {
                                temperature: 0.1,
                                maxOutputTokens: 600
                            }
                        })
                    });

                    if (response.ok) {
                        const data = await response.json();
                        const answer = data.candidates?.[0]?.content?.parts?.[0]?.text;
                        if (answer) {
                            botMessageElem.textContent = answer;
                            const chatBox = document.getElementById("chatBox");
                            chatBox.scrollTop = chatBox.scrollHeight;
                            success = true;
                            break; // تم جلب الإجابة بنجاح! نخرج من الحلقة
                        }
                    }
                } catch (e) {
                    console.log(`Model ${model} failed, trying next...`);
                }
            }

            if (!success) {
                botMessageElem.textContent = "⚠️ خوادم جوجل تشهد ضغطاً عالياً حالياً. يرجى المحاولة بعد لحظات قليلة.";
            }
        }

        function appendMessage(text, className, prefix = "") {
            const chatBox = document.getElementById("chatBox");
            const msgDiv = document.createElement("div");
            msgDiv.className = `message ${className}`;
            const id = "msg-" + Date.now() + Math.random().toString(36).substr(2, 5);
            msgDiv.id = id;
            msgDiv.textContent = prefix + text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return id;
        }

        function handleKeyPress(e) {
            if (e.key === "Enter") sendMessage();
        }
    </script>
</body>
</html>
