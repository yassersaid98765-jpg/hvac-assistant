<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خبير التكييف AI - محرك مزدوج</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 1px solid #1e293b;
        }
        .title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #38bdf8;
        }
        .btn-api {
            background-color: #059669;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .chat-box {
            flex: 1;
            overflow-y: auto;
            margin: 15px 0;
            padding: 10px;
            background-color: #1e293b;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            padding: 10px 14px;
            border-radius: 8px;
            max-width: 85%;
            line-height: 1.5;
            font-size: 0.95rem;
            white-space: pre-wrap;
        }
        .bot-msg {
            background-color: #334155;
            align-self: flex-start;
        }
        .user-msg {
            background-color: #0284c7;
            align-self: flex-end;
        }
        .input-area {
            display: flex;
            gap: 10px;
        }
        input[type="text"], input[type="password"] {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #334155;
            background-color: #1e293b;
            color: white;
            font-size: 1rem;
        }
        button.send-btn {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #1e293b;
            padding: 20px;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .btn-save { background: #059669; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; }
        .btn-close { background: #64748b; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <div class="title">❄️ خبير التكييف AI (محرك مزدوج)</div>
        <button class="btn-api" onclick="openKeyModal()">🔑 إعدادات API</button>
    </div>

    <div class="chat-box" id="chatBox">
        <div class="message bot-msg">أهلاً بك أستاذ ياسر. تم تفعيل نظام "الاحتياط التلقائي" لضمان استمرار العمل حتى لو كان الخادم مشغولاً. كيف أساعدك؟</div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="اكتب رمز العطل أو السؤال الفني..." onkeypress="handleKeyPress(event)">
        <button class="send-btn" onclick="sendMessage()">إرسال</button>
    </div>

    <div class="modal" id="keyModal">
        <div class="modal-content">
            <h3 style="margin:0; color:#38bdf8;">إعداد مفتاح API</h3>
            <p style="font-size:0.85rem; color:#94a3b8; margin:0;">أدخل مفتاح Gemini API الخاص بك:</p>
            <input type="password" id="apiKeyInput" placeholder="الصق المفتاح هنا (AIzaSy...)">
            <div class="modal-buttons">
                <button class="btn-close" onclick="closeKeyModal()">إلغاء</button>
                <button class="btn-save" onclick="saveApiKey()">حفظ المفتاح</button>
            </div>
        </div>
    </div>

    <script>
        function openKeyModal() {
            const currentKey = localStorage.getItem("gemini_api_key") || "";
            document.getElementById("apiKeyInput").value = currentKey;
            document.getElementById("keyModal").style.display = "flex";
        }

        function closeKeyModal() {
            document.getElementById("keyModal").style.display = "none";
        }

        function saveApiKey() {
            const key = document.getElementById("apiKeyInput").value.trim();
            if (key) {
                localStorage.setItem("gemini_api_key", key);
                alert("تم حفظ المفتاح بنجاح!");
                closeKeyModal();
            } else {
                alert("يرجى إدخال مفتاح صحيح.");
            }
        }

        // دالة مساعدة لتنفيذ الطلب لنموذج معين
        async function fetchFromModel(modelName, apiKey, promptText) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:streamGenerateContent?alt=sse&key=${apiKey}`;
            const response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: promptText }] }],
                    generationConfig: { maxOutputTokens: 800 }
                })
            });
            return response;
        }

        async function sendMessage() {
            const input = document.getElementById("userInput");
            const text = input.value.trim();
            if (!text) return;

            const apiKey = localStorage.getItem("gemini_api_key");
            if (!apiKey) {
                openKeyModal();
                return;
            }

            appendMessage(text, "user-msg", "أنت: ");
            input.value = "";

            const botMessageId = appendMessage("...", "bot-msg");
            const botMessageElem = document.getElementById(botMessageId);

            const promptText = "أنت مساعد فني خبير ومختصر جداً في صيانة التكييف والتبريد (HVAC/R). أجب بأسلوب مباشر وفي نقاط موجزة بدون مقدمات طويلة.\n\nالسؤال: " + text;
            
            // قائمة النماذج التي سنجربها بالترتيب
            const models = ["gemini-3.8-flash", "gemini-3.6-flash", "gemini-1.5-flash-latest"];
            let response = null;

            // 1. محاولة الاتصال بأول نموذج، وإذا فشل نجرب الذي يليه
            for (let i = 0; i < models.length; i++) {
                try {
                    botMessageElem.textContent = `جاري الاتصال بـ ${models[i]}...`;
                    response = await fetchFromModel(models[i], apiKey, promptText);
                    
                    if (response.ok) {
                        break; // نجح الاتصال، اخرج من الحلقة
                    } else if (response.status === 503 || response.status === 429) {
                        // الخادم مشغول، جرب النموذج التالي
                        console.log(`النموذج ${models[i]} مشغول، جاري التحويل...`);
                        continue; 
                    } else {
                        // خطأ آخر (مثل مفتاح خاطئ)، لا داعي لتجربة الباقي
                        break;
                    }
                } catch (e) {
                    console.log(`فشل الاتصال بـ ${models[i]}:`, e);
                }
            }

            if (!response || !response.ok) {
                let errMsg = "⚠️ تعذر الاتصال بجميع النماذج. ";
                if (response) {
                    const errText = await response.text();
                    errMsg += `(كود ${response.status}): ${errText}`;
                }
                botMessageElem.textContent = errMsg;
                return;
            }

            // 2. معالجة البث المباشر (SSE) من النموذج الذي نجح
            botMessageElem.textContent = "";
            const reader = response.body.getReader();
            const decoder = new TextDecoder("utf-8");
            let buffer = "";

            try {
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split("\n");
                    buffer = lines.pop();

                    for (const line of lines) {
                        if (line.startsWith("data: ")) {
                            const jsonStr = line.replace("data: ", "").trim();
                            if (jsonStr === "[DONE]") continue;
                            try {
                                const parsed = JSON.parse(jsonStr);
                                const chunkText = parsed.candidates?.[0]?.content?.parts?.[0]?.text;
                                if (chunkText) {
                                    botMessageElem.textContent += chunkText;
                                    const chatBox = document.getElementById("chatBox");
                                    chatBox.scrollTop = chatBox.scrollHeight;
                                }
                            } catch (e) {}
                        }
                    }
                }
                if (!botMessageElem.textContent) {
                    botMessageElem.textContent = "لم يتم تلقي أي نص، جرب سؤالاً آخر.";
                }
            } catch (err) {
                botMessageElem.textContent = "⚠️ انقطع الاتصال أثناء استلام الإجابة.";
            }
        }

        function appendMessage(text, className, prefix = "") {
            const chatBox = document.getElementById("chatBox");
            const msgDiv = document.createElement("div");
            msgDiv.className = `message ${className}`;
            const id = "msg-" + Date.now() + Math.random().toString(36).substr(2, 5);
            msgDiv.id = id;
            msgDiv.textContent = prefix + text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return id;
        }

        function handleKeyPress(e) {
            if (e.key === "Enter") sendMessage();
        }
    </script>
</body>
</html>
